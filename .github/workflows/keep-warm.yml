# Keep the Molly Spine (Render free tier) warm after Colin's first real visit of the day.
#
# Lives on `main` because GitHub only runs scheduled workflows from the default
# branch — the app itself lives on `molly-spine`. This is infra glue, not
# dashboard-world feature code.
#
# Design notes (v3):
# - GITHUB_TOKEN cannot write repo variables (403), so cross-run state lives in
#   actions/cache instead (restore-keys prefix picks up the latest).
# - The gate runs BEFORE any HTTP request: asking the service anything wakes
#   it, so idle-mode ticks outside the check window make ZERO requests —
#   otherwise the poller itself would keep the service up 24/7.
#
#   warm mode  — cached warm_until in the future: every 10-min tick pings
#   idle mode  — only ticks landing in minutes 0-9 (~1/hour) make a request,
#                reading lastVisit (stamped by real GET / page loads only,
#                persisted in the spine's SQLite so it survives sleep).
#                Fresh visit (< 80 min) → cache warm_until = visit + 6h.
#   manual     — workflow_dispatch POSTs /api/visit and opens the window now
#
# Free-tier budget: ~6h warm after a visit + ~15 min/idle-hour of check wakes
# ≈ 320h instance time/month worst case, inside Render's 750h — assuming this
# is the only free service burning hours in the workspace.

name: Keep Spine Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

env:
  SITE: https://molly-gz19.onrender.com
  WARM_SECS: "21600" # 6 hours
  FRESH_SECS: "4800" # visit counts as fresh for 80 min (covers hourly gap + cron jitter)

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore warm-state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: warm-state
          key: warm-state-${{ github.run_id }}
          restore-keys: warm-state-

      - name: Decide and poke
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          now=$(date +%s)
          minute=$((10#$(date +%M)))
          warm_until=0
          [ -f warm-state/warm_until ] && warm_until=$(cat warm-state/warm_until)

          save=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual warm-up — stamping a visit."
            curl -sf --max-time 90 -X POST "$SITE/api/visit" -o /dev/null || echo "stamp failed (cold start?)"
            warm_until=$(( now + WARM_SECS ))
            save=true
          elif [ "$now" -lt "$warm_until" ]; then
            echo "Warm window active — $(( (warm_until - now) / 60 )) min left. Poking."
            curl -sf --max-time 90 -o /dev/null "$SITE/api/health" || echo "poke failed (non-fatal)"
          elif [ "$minute" -lt 10 ]; then
            echo "Idle check (minute $minute) — asking for lastVisit."
            health=$(curl -sf --max-time 90 "$SITE/api/health" || echo '{}')
            last_visit=$(( $(echo "$health" | jq -r '.lastVisit // 0') / 1000 ))
            age=$(( now - last_visit ))
            if [ "$last_visit" -gt 0 ] && [ "$age" -lt "$FRESH_SECS" ]; then
              warm_until=$(( last_visit + WARM_SECS ))
              echo "Fresh visit $(( age / 60 )) min ago — warm window open until +6h from visit."
              save=true
            else
              echo "No fresh visit — letting it sleep."
            fi
          else
            echo "Idle (minute $minute) — no request this tick, letting it sleep."
          fi

          mkdir -p warm-state
          echo "$warm_until" > warm-state/warm_until
          echo "save=$save" >> "$GITHUB_OUTPUT"

      - name: Save warm-state
        if: steps.decide.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: warm-state
          key: warm-state-${{ github.run_id }}
